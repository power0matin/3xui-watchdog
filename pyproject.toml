[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "3xui-watchdog"
version = "0.1.0"
description = "Real-time watchdog for 3X-UI/Xray-core that instantly disconnects clients the moment their traffic quota or expiry is hit — no waiting, no full Xray restart."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "power0matin" }]
keywords = ["3x-ui", "xray", "xray-core", "vless", "vmess", "trojan", "watchdog", "vpn", "traffic-limit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
grpc = ["grpcio>=1.60", "grpcio-tools>=1.60", "protobuf>=4.25"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "mypy>=1.8", "ruff>=0.4", "types-PyYAML"]

[project.urls]
Homepage = "https://github.com/power0matin/3xui-watchdog"
Repository = "https://github.com/power0matin/3xui-watchdog"
Issues = "https://github.com/power0matin/3xui-watchdog/issues"

[project.scripts]
xui-watchdog = "xui_watchdog.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# NOTE: intentionally not enabling warn_unused_ignores. Whether
# ignore_missing_imports already covers the conditional `_xray_pb2`/`grpc`
# imports in xray_grpc_client.py (making their inline `# type: ignore[...]`
# comments redundant) depends on mypy-version-specific behavior around
# try/except ImportError blocks. Turning this on would make that ambiguity
# a hard CI failure instead of a harmless no-op; revisit once CI is
# actually green against a real mypy run and the exact codes are confirmed.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's default rule set: ruff
# 0.16.0 (2026-07-23) expanded its defaults from 59 rules to 413, which
# silently changed what CI enforced under our unpinned `ruff>=0.4` dev
# dependency and broke CI without any change to our code. E4/E7/E9/F is
# ruff's own pre-0.16 default and is what this codebase has been verified
# against. Broadening this deliberately (docstring rules, exception-message
# style, etc.) is a good follow-up, but should be its own reviewed change,
# not something that arrives for free on the next `pip install -e .[dev]`.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
markers = [
    "integration: requires a live 3x-ui+Xray stack (see tests/integration/docker-compose.ci.yml)",
]
asyncio_mode = "auto"
testpaths = ["tests"]
