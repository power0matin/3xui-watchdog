[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "3xui-watchdog"
version = "0.1.0"
description = "Real-time watchdog for 3X-UI/Xray-core that instantly disconnects clients the moment their traffic quota or expiry is hit — no waiting, no full Xray restart."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "power0matin" }]
keywords = ["3x-ui", "xray", "xray-core", "vless", "vmess", "trojan", "watchdog", "vpn", "traffic-limit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "grpcio>=1.60; extra == 'grpc'",
]

[project.optional-dependencies]
grpc = ["grpcio>=1.60", "grpcio-tools>=1.60", "protobuf>=4.25"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "mypy>=1.8", "ruff>=0.4", "types-PyYAML"]

[project.urls]
Homepage = "https://github.com/power0matin/3xui-watchdog"
Repository = "https://github.com/power0matin/3xui-watchdog"
Issues = "https://github.com/power0matin/3xui-watchdog/issues"

[project.scripts]
xui-watchdog = "xui_watchdog.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
markers = [
    "integration: requires a live 3x-ui+Xray stack (see tests/integration/docker-compose.ci.yml)",
]
asyncio_mode = "auto"
testpaths = ["tests"]
