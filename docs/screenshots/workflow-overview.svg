<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">3xui-watchdog workflow overview</title>
<desc id="desc">Documented flow from the 3X-UI REST API through quota and expiry evaluation to Xray gRPC removal or REST fallback, with full restart disabled by default.</desc>
<rect width="1280" height="800" fill="#0b0f16"/><rect x="44" y="42" width="1192" height="716" rx="20" fill="#111824" stroke="#2a3748" stroke-width="2"/>
<text x="82" y="112" fill="#f1f5f9" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">3XUI WATCHDOG</text><text x="82" y="150" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="17" letter-spacing="2">QUOTA &amp; EXPIRY ENFORCEMENT</text>
<rect x="936" y="76" width="250" height="42" rx="21" fill="#102b26" stroke="#1d8067"/><circle cx="960" cy="97" r="6" fill="#40d6a2"/><text x="978" y="103" fill="#8ff0c8" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">DRY-RUN SUPPORTED</text>
<rect x="82" y="205" width="300" height="188" rx="14" fill="#172333" stroke="#42617e" stroke-width="2"/><text x="110" y="249" fill="#7dd3fc" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">01 · INPUT</text><text x="110" y="291" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">3X-UI REST API</text><text x="110" y="329" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="17">Client list and traffic usage</text><text x="110" y="358" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="17">Expiry timestamps and status</text>
<path d="M382 299 H454" stroke="#5b8fb7" stroke-width="3" fill="none"/><path d="M443 288 L455 299 L443 310" stroke="#5b8fb7" stroke-width="3" fill="none"/>
<rect x="464" y="205" width="354" height="188" rx="14" fill="#1a2730" stroke="#3d806e" stroke-width="2"/><text x="492" y="249" fill="#6ee7b7" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">02 · POLICY CHECK</text><text x="492" y="289" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700">Watchdog evaluation</text><text x="492" y="331" fill="#d1fae5" font-family="monospace" font-size="17">total &gt; 0 &amp;&amp; used &gt;= total</text><text x="492" y="361" fill="#d1fae5" font-family="monospace" font-size="17">now &gt; expiryTime</text>
<path d="M818 299 H890" stroke="#5b8fb7" stroke-width="3" fill="none"/><path d="M879 288 L891 299 L879 310" stroke="#5b8fb7" stroke-width="3" fill="none"/>
<rect x="900" y="205" width="286" height="188" rx="14" fill="#172333" stroke="#42617e" stroke-width="2"/><text x="928" y="249" fill="#7dd3fc" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">03 · ENFORCEMENT</text><text x="928" y="291" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">One client at a time</text><text x="928" y="329" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="17">Prefer targeted removal</text><text x="928" y="358" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="17">Avoid restarting all sessions</text>
<text x="82" y="457" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Enforcement order</text>
<rect x="82" y="482" width="350" height="139" rx="12" fill="#102b26" stroke="#2a9d78" stroke-width="2"/><rect x="104" y="505" width="102" height="26" rx="13" fill="#145b46"/><text x="155" y="523" fill="#a7f3d0" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">PREFERRED</text><text x="104" y="562" fill="#f0fdf4" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">Xray gRPC</text><text x="104" y="592" fill="#bbf7d0" font-family="monospace" font-size="16">HandlerService.RemoveUser()</text>
<rect x="465" y="482" width="350" height="139" rx="12" fill="#18283b" stroke="#41698e" stroke-width="2"/><rect x="487" y="505" width="92" height="26" rx="13" fill="#24466a"/><text x="533" y="523" fill="#bfdbfe" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">FALLBACK</text><text x="487" y="562" fill="#eff6ff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">3X-UI REST API</text><text x="487" y="592" fill="#bfdbfe" font-family="monospace" font-size="16">disable-client</text>
<rect x="848" y="482" width="338" height="139" rx="12" fill="#302018" stroke="#a35d35" stroke-width="2"/><rect x="870" y="505" width="140" height="26" rx="13" fill="#63341f"/><text x="940" y="523" fill="#fed7aa" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">OPT-IN ONLY</text><text x="870" y="562" fill="#fff7ed" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">Full Xray restart</text><text x="870" y="592" fill="#fed7aa" font-family="Inter,Arial,sans-serif" font-size="16">Disabled by default</text>
<path d="M82 660 H1186" stroke="#283647" stroke-width="2"/><text x="82" y="704" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">--dry-run logs intended actions without changing clients or restarting Xray.</text><text x="1186" y="704" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="end">WORKFLOW ILLUSTRATION · NOT A LIVE CAPTURE</text>
</svg>